name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # main: one group per commit, never cancelled (runs queue per sha).
  # Other refs: one group per ref, superseded runs are cancelled.
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ACRETIA_LLM_MODE: replay
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  suite:
    name: suite (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-extras.txt
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libreoffice-calc libreoffice-impress poppler-utils tesseract-ocr \
            fonts-dejavu fonts-crosextra-carlito fonts-noto-core
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first, so docling does not pull the multi-GB CUDA build.
          if grep -qi '^docling' requirements-extras.txt requirements.txt 2>/dev/null; then
            python -m pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install -r requirements.txt -r requirements-extras.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Offline suite (replay mode, no provider keys)
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: python -m unittest discover -s tests -q

  gates:
    name: gates
    needs: suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-extras.txt
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libreoffice-calc libreoffice-impress poppler-utils tesseract-ocr \
            fonts-dejavu fonts-crosextra-carlito fonts-noto-core
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          if grep -qi '^docling' requirements-extras.txt requirements.txt 2>/dev/null; then
            python -m pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install -r requirements.txt -r requirements-extras.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Stage gates (scripts/verify_*.py)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          shopt -s nullglob
          gates=(scripts/verify_*.py)
          if [ ${#gates[@]} -eq 0 ]; then echo "::error::no scripts/verify_*.py found"; exit 1; fi
          fail=0
          rows=""
          for g in "${gates[@]}"; do
            echo "::group::$g"
            start=$(date +%s)
            if python "$g"; then status=PASS; else status=FAIL; fail=1; fi
            rows+=$(printf '| %-28s | %-4s | %4ss |' "$g" "$status" "$(( $(date +%s) - start ))")$'\n'
            echo "::endgroup::"
          done
          {
            echo "### Stage gates"
            echo "| gate | result | time |"
            echo "|---|---|---|"
            printf '%s' "$rows"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $fail

  ledger-and-secrets:
    name: ledger-and-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Licence ledger, copyleft isolation, import ledger coverage
        run: python scripts/verify_s1.py
      - name: Secret scan (tracked tree)
        run: python scripts/secret_scan.py --all-history false
      - name: Provider SDKs only imported in src/harness/adapter.py
        run: |
          python - <<'PY'
          import ast, os, sys
          SDKS = {"anthropic", "openai", "google.generativeai", "google.genai", "mistralai", "cohere",
                  "litellm", "groq", "together", "boto3"}
          ALLOWED = {"src/harness/adapter.py"}
          hits = []
          for dp, dn, fs in os.walk("."):
              dn[:] = [d for d in dn if d not in (".git", "__pycache__", ".venv", "node_modules", "reference")]
              for f in fs:
                  if not f.endswith(".py"):
                      continue
                  p = os.path.relpath(os.path.join(dp, f), ".")
                  if p in ALLOWED:
                      continue
                  try:
                      tree = ast.parse(open(p, encoding="utf-8").read(), p)
                  except SyntaxError as e:
                      hits.append(f"{p}: unparsable ({e})")
                      continue
                  for n in ast.walk(tree):
                      mods = []
                      if isinstance(n, ast.Import):
                          mods = [a.name for a in n.names]
                      elif isinstance(n, ast.ImportFrom) and n.module and not n.level:
                          mods = [n.module]
                      elif (isinstance(n, ast.Call) and n.args and isinstance(n.args[0], ast.Constant)
                            and getattr(n.func, "attr", getattr(n.func, "id", "")) in ("import_module", "__import__")):
                          mods = [str(n.args[0].value)]
                      for m in mods:
                          if m.split(".")[0] in SDKS or any(m == s or m.startswith(s + ".") for s in SDKS):
                              hits.append(f"{p}:{n.lineno} imports {m}")
          print("\n".join(hits) or "clean")
          sys.exit(1 if hits else 0)
          PY

  libreoffice-agreement:
    name: libreoffice-agreement
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - name: Skip notice
        if: env.SEC_USER_AGENT == ''
        run: echo "::notice::SEC_USER_AGENT secret not set; LibreOffice agreement bench skipped."
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.SEC_USER_AGENT != ''
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: env.SEC_USER_AGENT != ''
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-extras.txt
      - name: Install
        if: env.SEC_USER_AGENT != ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libreoffice-calc fonts-dejavu fonts-crosextra-carlito
          python -m pip install -r requirements.txt
      - name: Bench AAPL MSFT against LibreOffice recalculation
        if: env.SEC_USER_AGENT != ''
        run: python3 open_multiples.py bench AAPL MSFT --libreoffice
