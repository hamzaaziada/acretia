      highlight: 1
      kpis:
      - label: ARR
        value: $226m
        context: Enterprise led
        change:
          text: +24% YoY
          direction: up
      - label: Net revenue retention
        value: 118%
        context: Cohorts expand
        change:
          text: +3 pts
          direction: up
      - label: Gross margin
        value: 78%
        context: Cloud hosting scale
        change:
          text: +2 pts
          direction: up
      - label: Rule of 40
        value: '41'
        context: Growth plus FCF margin
        change:
          text: +6 pts
          direction: up
      so_what: Quality of revenue supports a premium to the peer median.
    notes: 'Evidence slide 3: Falcon combines 24% growth, 118% net retention and a Rule of'
