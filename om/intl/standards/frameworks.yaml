# Acretia S8.1 framework layer. Written in our own words; sources cited, no copied standard text.
common:
  bs_lines: &bs_lines
    - Property, plant and equipment
    - Investment property
    - Intangible assets
    - Goodwill
    - Investments accounted for using the equity method
    - Other financial assets
    - Inventories
    - Trade and other receivables
    - Cash and cash equivalents
    - Assets held for sale
    - Trade and other payables
    - Provisions
    - Financial liabilities (borrowings, lease liabilities)
    - Current tax assets and liabilities
    - Deferred tax assets and liabilities
    - Non-controlling interests (within equity)
    - Issued capital and reserves attributable to owners
  is_lines: &is_lines
    - Revenue
    - Finance costs
    - Share of profit or loss of associates and joint ventures
    - Tax expense
    - Post-tax result of discontinued operations
    - Profit or loss for the period
    - Profit attributable to owners and to non-controlling interests
  cf_lines: &cf_lines
    - Cash flows from operating activities
    - Cash flows from investing activities
    - Cash flows from financing activities
    - Net change in cash and cash equivalents
    - Effect of exchange rate changes on cash
    - Cash and cash equivalents at start and end of period
  urls:
    ifrs_ias1: &u_ias1 "https://www.ifrs.org/issued-standards/list-of-standards/ias-1-presentation-of-financial-statements/"
    ifrs_ias7: &u_ias7 "https://www.ifrs.org/issued-standards/list-of-standards/ias-7-statement-of-cash-flows/"
    ifrs_18: &u_ifrs18 "https://www.ifrs.org/issued-standards/list-of-standards/ifrs-18-presentation-and-disclosure-in-financial-statements/"
    asc: &u_asc "https://asc.fasb.org/"
    frs102: &u_frs102 "https://www.frc.org.uk/library/standards-codes-policy/accounting-and-reporting/uk-and-ireland-standards/frs-102/"
    indas: &u_indas "https://www.mca.gov.in/content/mca/global/en/acts-rules/ebooks/accounting-standards.html"
    fra: &u_fra "https://fra.gov.eg/"
    socpa: &u_socpa "https://socpa.org.sa/"
    ifrs_adoption: &u_adopt "https://www.ifrs.org/use-around-the-world/use-of-ifrs-standards-by-jurisdiction/"

frameworks:
  - id: IFRS
    name: IFRS Accounting Standards (full IFRS)
    jurisdictions: [International, EU (as endorsed), most of the world]
    issuer: IASB (IFRS Foundation)
    summary: >-
      The global baseline. Companies choose the layout of the profit and loss statement (by function or by nature) and
      order the balance sheet by liquidity or by current/non-current split. IFRS 18 replaces IAS 1 presentation rules
      from annual periods beginning 1 January 2027 and adds operating, investing and financing categories with
      mandatory subtotals.
    relationship_to_ifrs: This is the reference framework; every other entry in the base is described by its gap to it.
    effective_dates:
      - "IFRS 15: periods from 1 Jan 2018"
      - "IFRS 9: periods from 1 Jan 2018"
      - "IFRS 16: periods from 1 Jan 2019"
      - "IFRS 18: periods from 1 Jan 2027 (replaces IAS 1 presentation; comparatives restated)"
    presentation:
      pnl_layout: Choice between expenses by function (cost of sales) and by nature (materials, staff costs, depreciation); by-nature reporters usually show no gross profit and no operating profit line before IFRS 18.
      balance_sheet_order: Current/non-current split is the default; a liquidity ordering is allowed when more relevant (typical for banks and some real estate firms).
      oci: Items that may later move to profit or loss (cash flow hedges, foreign operation translation, debt instruments at fair value through OCI) are shown apart from items that will not (revaluation surplus, equity instruments at fair value through OCI, defined benefit remeasurements).
      required_line_items:
        IS: *is_lines
        BS: *bs_lines
        CF: *cf_lines
      cash_flow:
        method: Direct or indirect for operating activities; indirect is dominant in practice.
        interest_paid: Operating or financing, chosen and applied consistently.
        interest_received: Operating or investing.
        dividends_paid: Operating or financing.
        dividends_received: Operating or investing.
    measurement_bases:
      - Historical cost (inventory at lower of cost and net realisable value, most PPE)
      - Revaluation model allowed for PPE and intangibles with an active market
      - Fair value for investment property (optional), derivatives and many financial assets
      - Amortised cost with expected credit loss for loans and receivables
      - Defined benefit obligations at actuarial present value
    key_disclosures:
      - Segment information on the chief operating decision maker view (IFRS 8, listed entities)
      - Related party transactions and key management pay (IAS 24)
      - Lease maturity analysis, right-of-use movement and lease cash outflow (IFRS 16)
      - Revenue disaggregation, contract balances and remaining performance obligations (IFRS 15)
      - Expected credit loss movement and credit risk concentration (IFRS 7 and IFRS 9)
      - Tax rate reconciliation and unrecognised deferred tax (IAS 12)
      - Impairment test assumptions for goodwill (IAS 36)
      - Basic and diluted earnings per share (IAS 33)
    citations:
      - {standard: "IAS 1", ref: "paras 54, 82 (minimum line items)", url: *u_ias1}
      - {standard: "IAS 7", ref: "paras 31-34 (interest and dividends)", url: *u_ias7}
      - {standard: "IFRS 18", ref: "Presentation categories and mandatory subtotals", url: *u_ifrs18}
    authored: acretia
    confidence: verified

  - id: EAS
    name: Egyptian Accounting Standards
    jurisdictions: [Egypt]
    issuer: Ministry of Investment and the Financial Regulatory Authority (FRA) process; standards issued by ministerial or prime ministerial decree
    summary: >-
      A national set modelled on IFRS with a time lag. The 2015 reissue brought most standards close to older IAS text;
      newer standards for financial instruments (EAS 47), revenue (EAS 48) and leases (EAS 49) track IFRS 9, 15 and 16.
      Listed Egyptian groups report under EAS in local currency (EGP), usually by function with a current/non-current
      balance sheet. Special accounting treatments for foreign exchange (EAS 13 annexes) have been issued after the major
      devaluations and can defer or capitalise FX differences.
    relationship_to_ifrs: Not full IFRS. Lag in standards, some choices removed or added, and temporary special treatments that have no IFRS counterpart (FX relief annexes).
    effective_dates:
      - "EAS 47 financial instruments, EAS 48 revenue, EAS 49 leases: issued 2019, effective dates were postponed more than once (UNVERIFIED: exact decree and dates)"
      - "EAS 13 special FX treatment: issued after the Nov 2016 float and reissued for 2022-2024 devaluations (UNVERIFIED: decree numbers)"
    presentation:
      pnl_layout: Mostly by function (revenue, cost of sales, gross profit, administrative and selling expenses); by nature occurs.
      balance_sheet_order: Current/non-current split. Statements are often bilingual (Arabic and English) with Arabic as legal text.
      oci: Presented as a separate statement of comprehensive income; fewer items than IFRS in practice (translation, hedges, some revaluation).
      required_line_items:
        IS: *is_lines
        BS: *bs_lines
        CF: *cf_lines
      cash_flow:
        method: Indirect is the norm; direct allowed.
        interest_paid: Operating or financing, disclosed.
        interest_received: Operating or investing.
        dividends_paid: Financing.
        dividends_received: Operating or investing.
    measurement_bases:
      - Historical cost; revaluation model for PPE was removed in the 2015 reissue (UNVERIFIED: confirm current position)
      - Amortised cost with ECL under EAS 47 for entities that adopted it; older incurred-loss rules before
      - Foreign currency monetary items at closing rate with EAS 13 special treatment where elected
    key_disclosures:
      - Foreign currency exposure and any special FX treatment elected
      - Related parties and board remuneration
      - Segment note for listed entities
      - Lease commitments and right-of-use movement after EAS 49
    citations:
      - {standard: "Egyptian Accounting Standards", ref: "Index of issued standards, EAS 1 Presentation, EAS 13 FX", url: *u_fra}
    authored: acretia
    confidence: unverified

  - id: SOCPA-IFRS
    name: IFRS as endorsed in the Kingdom of Saudi Arabia (SOCPA)
    jurisdictions: [Saudi Arabia]
    issuer: SOCPA (Saudi Organization for Chartered and Professional Accountants)
    summary: >-
      Full IFRS for listed companies and many others since 2017, with one carve-out: zakat and income tax are not
      accounted for under IAS 12 and IFRIC 21 but follow SOCPA and ZATCA guidance. Zakat on Saudi and GCC owners
      is therefore shown as its own line and profit is quoted before zakat and income tax. Statements are in SAR, often
      bilingual, mostly by function, with current/non-current ordering.
    relationship_to_ifrs: Full IFRS except the zakat and tax carve-out; IFRS for SMEs for small entities.
    effective_dates:
      - "Full IFRS for listed companies: periods from 1 Jan 2017 (UNVERIFIED: exact SOCPA circular)"
      - "Zakat recognised in profit or loss rather than retained earnings: from 2019 (UNVERIFIED)"
    presentation:
      pnl_layout: By function is typical; profit before zakat and income tax is a standard subtotal.
      balance_sheet_order: Current/non-current split; zakat payable appears as a liability.
      oci: As IFRS, including defined benefit remeasurements of end-of-service obligations.
      required_line_items:
        IS: *is_lines
        BS: *bs_lines
        CF: *cf_lines
      cash_flow:
        method: Indirect.
        interest_paid: Usually financing or operating, per policy.
        interest_received: Operating or investing.
        dividends_paid: Financing.
        dividends_received: Operating or investing.
    measurement_bases:
      - As IFRS
      - Zakat measured on the zakat base under ZATCA rules, not as temporary-difference tax
      - End-of-service benefits as defined benefit plan under IAS 19 with actuarial valuation
    key_disclosures:
      - Zakat and income tax charge split between Saudi/GCC and foreign shareholders
      - Zakat assessment status with ZATCA
      - End-of-service benefit actuarial assumptions
      - IFRS 16 lease disclosures, often large for retailers
    citations:
      - {standard: "SOCPA endorsement of IFRS", ref: "Framework adoption and zakat/tax carve-out", url: *u_socpa}
      - {standard: "IFRS adoption by jurisdiction", ref: "Saudi Arabia profile", url: *u_adopt}
    authored: acretia
    confidence: unverified

  - id: UAE-IFRS
    name: IFRS in the UAE and wider GCC (UAE, Qatar, Kuwait, Bahrain, Oman)
    jurisdictions: [UAE, Qatar, Kuwait, Bahrain, Oman]
    issuer: Local securities regulators and commercial company laws; IASB standards used unmodified
    summary: >-
      Listed and most regulated entities in the UAE apply full IFRS as issued by the IASB with no local carve-outs.
      Federal corporate tax (9 percent above a threshold) began for financial years starting on or after 1 June 2023,
      so earlier years show no income tax for most UAE entities and later years need deferred tax. Gratuity under the
      labour law is a defined benefit item.
    relationship_to_ifrs: Full IFRS, unmodified. GCC states differ on local tax and labour law, not on the standards.
    effective_dates:
      - "UAE federal corporate tax: financial years starting on or after 1 June 2023 (UNVERIFIED: confirm decree text)"
    presentation:
      pnl_layout: By function typical; real estate developers often show revenue and direct costs.
      balance_sheet_order: Current/non-current; some developers present a liquidity ordering.
      oci: As IFRS.
      required_line_items:
        IS: *is_lines
        BS: *bs_lines
        CF: *cf_lines
      cash_flow:
        method: Indirect.
        interest_paid: Operating or financing, per policy.
        interest_received: Operating or investing.
        dividends_paid: Financing.
        dividends_received: Operating or investing.
    measurement_bases:
      - As IFRS; investment property commonly at fair value
      - Revaluation model used by some for property
    key_disclosures:
      - Corporate tax status and deferred tax opening balances
      - Employee end-of-service provisions
      - Contract liabilities and escrow balances for developers
      - Related party balances with government-linked shareholders
    citations:
      - {standard: "IFRS adoption by jurisdiction", ref: "UAE profile", url: *u_adopt}
    authored: acretia
    confidence: unverified

  - id: FRS102
    name: UK FRS 102 (The Financial Reporting Standard applicable in the UK and Republic of Ireland)
    jurisdictions: [United Kingdom, Ireland]
    issuer: Financial Reporting Council (FRC)
    summary: >-
      A single reduced-disclosure standard for entities outside UK-adopted IFRS. The 2024 periodic review amendments,
      effective for periods starting on or after 1 January 2026, bring a five-step revenue model and on-balance-sheet
      lessee accounting close to IFRS 15 and IFRS 16. Older years show operating leases as rent expense.
    relationship_to_ifrs: Based on IFRS for SMEs with additions; permits policy choices (capitalise or expense development costs, amortise goodwill).
    effective_dates:
      - "2024 periodic review amendments: periods beginning on or after 1 Jan 2026, early adoption allowed"
    presentation:
      pnl_layout: Formats prescribed by the Companies Act; by function (format 1) or by nature (format 2).
      balance_sheet_order: Fixed assets, current assets and creditors split by one year, net current assets subtotal.
      oci: Statement of comprehensive income or a single combined statement.
      required_line_items:
        IS: *is_lines
        BS: *bs_lines
        CF: *cf_lines
      cash_flow:
        method: Indirect or direct; small entities exempt.
        interest_paid: Operating or financing.
        interest_received: Operating or investing.
        dividends_paid: Financing.
        dividends_received: Operating or investing.
    measurement_bases:
      - Historical cost with optional revaluation
      - Goodwill and intangibles amortised over useful life (up to ten years when life cannot be reliably estimated)
      - Choice of IFRS 9 or FRS 102 sections 11 and 12 for financial instruments
    key_disclosures:
      - Accounting policy choices (development cost, revaluation)
      - Audit and directors remuneration disclosures required by the Companies Act
      - Lease commitments under non-cancellable operating leases (before 2026)
    citations:
      - {standard: "FRS 102", ref: "Sections 1A, 4, 5, 6, 18, 20, 23", url: *u_frs102}
    authored: acretia
    confidence: verified

  - id: IndAS
    name: Indian Accounting Standards (Ind AS)
    jurisdictions: [India]
    issuer: Ministry of Corporate Affairs on advice of the National Financial Reporting Authority; ICAI drafts
    summary: >-
      Converged with IFRS but not identical. Notified under the Companies (Indian Accounting Standards) Rules 2015 and
      mandatory in phases for larger and listed companies. Differences are called carve-outs: investment property uses
      cost only, business combinations under common control use pooling of interests, and a few presentation and
      measurement options differ. Reporting is in INR, with a fiscal year ending 31 March.
    relationship_to_ifrs: Substantially converged with carve-outs (investment property, common-control combinations, some financial instrument and employee benefit details).
    effective_dates:
      - "Phased adoption from fiscal 2016-17 for listed and large companies"
    presentation:
      pnl_layout: Schedule III of the Companies Act prescribes a by-nature statement of profit and loss.
      balance_sheet_order: Schedule III prescribed current/non-current format.
      oci: Separate OCI section in the same statement as profit or loss.
      required_line_items:
        IS: *is_lines
        BS: *bs_lines
        CF: *cf_lines
      cash_flow:
        method: Indirect usual; direct allowed.
        interest_paid: Financing for non-finance entities.
        interest_received: Investing.
        dividends_paid: Financing.
        dividends_received: Investing.
    measurement_bases:
      - Cost for investment property (fair value model not permitted)
      - Pooling at carrying amounts for common-control business combinations
      - Fair value or amortised cost for financial instruments as IFRS 9
    key_disclosures:
      - Schedule III line items and note layout
      - Operating segments for listed companies
      - Related parties and CSR spending
    citations:
      - {standard: "Ind AS", ref: "Ind AS 1, 40, 103 (Appendix C), 116", url: *u_indas}
    authored: acretia
    confidence: verified

  - id: USGAAP
    name: US generally accepted accounting principles (FASB ASC)
    jurisdictions: [United States]
    issuer: FASB, with SEC rules for registrants
    summary: >-
      Rules-based, codified. Expenses may be by function (usual) with income from operations; the balance sheet
      follows a liquidity-loose current/non-current split. Operating leases remain a single straight-line cost in
      operating expenses under ASC 842, LIFO is allowed, development costs are generally expensed, and revaluation up
      is not allowed. Many analyst adjustments exist to make US companies comparable to IFRS peers.
    relationship_to_ifrs: Different framework with partial convergence on revenue (ASC 606 vs IFRS 15) and financial instrument credit losses (CECL differs from IFRS 9).
    effective_dates:
      - "ASC 842 leases: public entities fiscal years after 15 Dec 2018"
      - "ASC 606 revenue: public entities fiscal years after 15 Dec 2017"
    presentation:
      pnl_layout: By function with income from operations (SEC rules require cost-by-nature breakdown only for some captions).
      balance_sheet_order: Current/non-current (classified) by convention; not mandated for all entities.
      oci: Separate statement or combined; accumulated OCI shown in equity.
      required_line_items:
        IS: *is_lines
        BS: *bs_lines
        CF: *cf_lines
      cash_flow:
        method: Indirect usual; direct allowed with a reconciliation.
        interest_paid: Operating (not a choice).
        interest_received: Operating.
        dividends_paid: Financing.
        dividends_received: Operating.
    measurement_bases:
      - Historical cost; no upward revaluation of PPE or intangibles
      - LIFO, FIFO or average cost for inventory
      - Fair value option for some financial instruments
      - Current expected credit loss model (CECL) for financial assets at amortised cost
    key_disclosures:
      - LIFO reserve
      - Operating lease cost, weighted average discount rate and remaining term (ASC 842)
      - Non-GAAP reconciliations required for SEC filers
      - Segment expense disclosure
    citations:
      - {standard: "FASB ASC", ref: "Topics 205, 220, 230, 330, 606, 842", url: *u_asc}
    authored: acretia
    confidence: verified
