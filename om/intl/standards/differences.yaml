  - id: diff-indas-applicability
    topic: presentation
    frameworks: [IndAS, IFRS]
    summary: >-
      Ind AS is mandatory in phases under the Companies (Indian Accounting Standards) Rules. From the year starting 1 April 2016, listed
      companies and unlisted companies with net worth of INR 500 crore or more must apply it, together with their parents, subsidiaries, associates and
      joint ventures. From 1 April 2017 it extends to all listed companies and unlisted companies with net worth of INR 250 crore up to 500
      crore. Companies on SME exchanges and those under INR 250 crore stay on the older Accounting Standards. Net worth is
      measured on standalone statements, and once Ind AS applies it continues even if net worth falls. Banks, insurers and NBFCs follow later dates.
    analyst_impact: >-
      Check which accounting regime an Indian company uses before comparing: pre-2016 or smaller companies are not on Ind AS, so
      leases, financial instruments and business combinations differ from IFRS peers.
