  - id: diff-leases-indas116
    topic: leases
    frameworks: [IndAS, IFRS]
    summary: >-
      Ind AS 116 is close to IFRS 16: lessees put nearly all leases on the balance sheet, depreciate the right-of-use asset and
      accrue interest on the lease liability, and it applies to annual periods beginning on or after 1 April 2019. Carve-outs and
      differences are small. Ind AS 116 does not allow the fair value model for a right-of-use asset that meets the
      investment property definition, and it always classes the interest part of lease payments in financing cash flows. The
      old Ind AS 17 exemption from straight-lining lessor income for inflation-linked rent was dropped, matching IFRS 16.
    analyst_impact: >-
      Treat Indian EBITDA as post-16, as for IFRS; convert to pre-16 by deducting lease payments, and remember lease interest is outside operating cash flow.
      Fiscal years end 31 March, so calendarise before comparing with December reporters.
    adjustment: ifrs16_to_pre16_ebitda
