  - id: diff-frs102-vs-ifrs
    topic: presentation
    frameworks: [FRS102, IFRS]
    summary: >-
      FRS 102 permits policy choices that IFRS removes: expensing development, expensing borrowing costs, a cost
      option for investment property in some cases, and goodwill amortisation over a limited life. Until 2026 leases of lessees stayed
      off balance sheet if operating. After the 2024 amendments, revenue and leases follow an IFRS-like approach.
    analyst_impact: >-
      Compare UK private company accounts with IFRS peers after adding back goodwill amortisation and pre-2026 lease commitments.
    adjustment: capitalise_operating_leases
    keywords: [frs 102, uk gaap, goodwill amortisation, operating lease commitments, small company, companies act]
    citations:
      - {standard: "FRS 102", ref: "Sections 18, 19, 20, 23", url: *frs102}
    authored: acretia
    confidence: verified

  - id: diff-ecl-ifrs9-eas47-cecl
    topic: credit_losses
    frameworks: [IFRS, EAS, USGAAP]
    summary: >-
      IFRS 9 uses three stages of expected credit loss, with lifetime loss on significant credit deterioration. US CECL books lifetime loss
      at initial recognition for all assets at amortised cost. EAS 47 follows IFRS 9 where adopted; earlier Egyptian rules used incurred
      loss or regulator-set provisions for banks.
    analyst_impact: >-
      Compare provisioning on loans and receivables by looking at coverage ratios; do not read a first-year ECL step as underlying deterioration.
    adjustment: eas_to_ifrs_map
    keywords: [ecl, cecl, expected credit loss, stage 2, allowance, provision, eas 47, ifrs 9, credit loss]
