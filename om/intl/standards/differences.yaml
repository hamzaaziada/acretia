  - id: diff-eosb-gcc-egypt
    topic: end_of_service
    frameworks: [UAE-IFRS, EAS, IFRS]
    summary: >-
      The UAE labour law obliges private employers to pay a gratuity on leaving, in the order of 21 days of basic pay per year for the
      first five years and 30 days per year afterwards, capped at about two years of pay (secondary sources only). IAS 19
      treats these as defined benefit plans, so companies should have actuarial valuations with remeasurements in OCI.
      Egyptian private employers lean on social insurance, with contractual schemes treated case by case.
    analyst_impact: >-
      The end-of-service provision is debt-like but rarely in reported net debt. Add it to adjusted debt when material, and watch the discount rate and cash payout in the cash flow.
    adjustment: eosb_as_debt_like
