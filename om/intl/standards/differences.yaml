      starting on or after 1 June 2023, so IAS 12 current and deferred tax appear for UAE groups from their 2024 reports.
      Qualifying free zone income may be taxed at 0 percent. Earlier years show almost no income tax, so effective tax rates are not
      comparable across the change.
