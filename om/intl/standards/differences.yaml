  - id: diff-eosb-ksa
    topic: end_of_service
    frameworks: [SOCPA-IFRS, IFRS]
    summary: >-
      Under the Saudi Labour Law an employer pays an end-of-service award on termination: half a month of the last wage for each of the
      first five years and a full month for each later year, with part years pro-rated. When the worker resigns the award is reduced:
      nothing under two years, one third from two to under five years, two thirds from five to under ten, in full after ten.
      Saudi reports treat the obligation as a defined benefit plan under IAS 19, valued actuarially, with remeasurements in OCI.
    analyst_impact: >-
      Treat the end-of-service provision as debt-like when material and add it to adjusted net debt; note it grows with headcount and
      wage inflation and is paid out in cash on exits, so check the movement note for payouts versus current service cost.
    adjustment: eosb_as_debt_like
    keywords: [eosb, end of service, saudi, labour law, award, gratuity, ias 19, resignation, half month]
