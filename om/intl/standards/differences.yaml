  - id: diff-frs102-vs-ifrs
    topic: presentation
    frameworks: [FRS102, IFRS]
    summary: >-
      FRS 102 permits policy choices that IFRS removes: expensing or capitalising development, expensing or capitalising borrowing costs,
      and amortising goodwill over its useful life (a maximum of ten years when the life cannot be estimated reliably) where IFRS tests goodwill
      for impairment each year and never amortises it. Until 2026 operating leases of lessees stayed off balance sheet. After the 2024
      amendments (periods from 1 January 2026), revenue and leases follow an IFRS 15 and IFRS 16 like approach.
    analyst_impact: >-
      Compare UK private company accounts with IFRS peers after adding back goodwill amortisation and pre-2026 lease commitments, and decide a common development and borrowing cost policy.
    adjustment: capitalise_operating_leases
    keywords: [frs 102, uk gaap, goodwill amortisation, ten years, operating lease commitments, small company, companies act]
    citations:
