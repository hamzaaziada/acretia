  - id: diff-uae-ifrs-requirement
    topic: framework_adoption
    frameworks: [UAE-IFRS, IFRS]
    summary: >-
      The UAE has never had a local GAAP: its commercial companies legislation requires international accounting standards, which in
      practice means IFRS as issued by the IASB (Federal Decree-Law 32 of 2021 replaced the 2015 companies law, which carried the same requirement).
      Listed companies trade on the Dubai Financial Market or the Abu Dhabi Securities Exchange; ADX listing rules require IFRS and DFM permits it with most issuers using it.
      The securities regulator, formerly the Securities and Commodities Authority (SCA), was reconstituted as the Capital Market Authority (CMA)
      under Federal Decree-Laws 32 and 33 of 2025, effective 1 January 2026. New IFRS standards apply from their own effective dates because there is no endorsement step.
    analyst_impact: >-
      UAE listed statements are full IFRS with no carve-outs, so use IFRS recipes unchanged; some financial institutions may use AAOIFI, so check the basis
      of preparation note. Refer to the regulator by its current name when sourcing disclosures after 2025.
    adjustment: eas_to_ifrs_map
    keywords: [uae ifrs, commercial companies law, federal decree-law 32 of 2021, sca, cma, capital market authority, dfm, adx, listed companies, no local gaap]
    verified_facts:
