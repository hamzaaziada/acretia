  - id: diff-zakat-vs-income-tax
    topic: zakat_tax
    frameworks: [SOCPA-IFRS, IFRS]
    summary: >-
      In Saudi Arabia zakat is a 2.5 percent charge on the zakat base (broadly net worth as computed for zakat) and falls on the Saudi
      and GCC owners' share, while income tax at 20 percent of adjusted profit applies to the share held by non-Saudi, non-GCC owners.
      Mixed-ownership companies bear both in proportion. SOCPA's position is that zakat sits outside IAS 12, so it is
      accounted for under its own endorsed requirements and IAS 8 rather than as an IAS 12 income tax, and there is no deferred tax on
      zakat. A live IFRS 18 debate concerns whether zakat is presented together with income tax or in operating results.
    analyst_impact: >-
      Compare KSA companies on a pre-zakat and pre-tax basis, or treat zakat as a tax by adding it to tax expense (recipe zakat_as_tax).
      Effective tax rates are not comparable across ownership structures, and net income to owners is after zakat. Do not leave zakat in operating costs.
    adjustment: zakat_as_tax
    keywords: [zakat, zatca, gazt, income tax, zakat base, saudi, ksa, profit before zakat, tax rate, 2.5%, 20%, mixed ownership]
