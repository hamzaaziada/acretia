  - id: diff-uae-corporate-tax
    topic: zakat_tax
    frameworks: [UAE-IFRS, IFRS]
    summary: >-
      The UAE introduced federal corporate tax at 9 percent on profit above a threshold for financial years starting on or after
      1 June 2023, so IAS 12 current and deferred tax appear for many UAE groups from 2024 reports. Free zone companies may be taxed at 0 percent on qualifying income.
      Earlier years show almost no income tax, so effective tax rates are not comparable.
    analyst_impact: >-
      Compare after-tax profit on a normalised tax rate; adjust prior years or use pre-tax profit when mixing periods.
