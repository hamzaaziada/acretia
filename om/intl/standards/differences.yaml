  - id: diff-eas17-separate-fs
    topic: associates_jvs
    frameworks: [EAS, IFRS]
    summary: >-
      In separate financial statements IAS 27 lets a parent carry subsidiaries, associates and joint ventures at cost, at fair value under
      IFRS 9, or using the equity method. The IFRS Foundation profile for Egypt (January 2024) says the equity method was not an
      alternative under EAS in separate statements. Prime Ministerial Decree 636 of 2024 replaced EAS 17 (separate financial
      statements); secondary summaries say the new text adds the equity method as an option, which has not been confirmed.
      Egyptian holding companies therefore often show investments at cost in the separate set and only the consolidated set carries equity-accounted results.
    analyst_impact: >-
      Use consolidated statements for valuation; in the separate set, investment income is dividends, not share of profit. Check which
      method was used before comparing parent-only profit or equity across years or with IFRS peers.
