  - id: diff-ind-as-carveouts
    topic: presentation
    frameworks: [IndAS, IFRS]
    summary: >-
      Ind AS differs from IFRS in a few places: no fair value model for investment property (Ind AS 40), pooling at carrying values for
      common-control business combinations (Ind AS 103 Appendix C), a mandatory by-nature layout in Schedule III, and some
      financial instrument and employee benefit details. The reporting year ends 31 March.
    analyst_impact: >-
      Calendarise to a common year end; expect no goodwill on group reorganisations; handle by-nature profit.
    adjustment: by_nature_ebit
