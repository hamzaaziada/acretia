  - id: diff-socpa-ifrs-adoption
    topic: framework_adoption
    frameworks: [SOCPA-IFRS, IFRS]
    summary: >-
      Saudi Arabia moved to IFRS as endorsed by SOCPA in stages. Listed entities applied it from 1 January 2017, the date
      set by the SOCPA decision and followed by the capital market regulator, which asked listed companies to report their transition
      progress. Other establishments follow for periods after 1 January 2018, with early application possible from 2017; non-publicly-accountable
      entities use the SMEs framework rather than full IFRS. Banks and insurers already reported under IFRS earlier. During the first
      years the cost model was kept for PPE and intangibles, so Saudi figures before and after transition are not on the same footing.
    analyst_impact: >-
      Do not compare Saudi statements across the 2016 to 2017 boundary without the transition reconciliation (retained earnings
      and equity restated); check which framework an unlisted Saudi counterparty used.
