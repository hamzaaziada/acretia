differences:
  - id: diff-leases-ifrs16-asc842
    topic: leases
    frameworks: [IFRS, USGAAP, SOCPA-IFRS, UAE-IFRS, IndAS]
    summary: >-
      IFRS 16 puts nearly every lease on the balance sheet and splits cost into depreciation and interest, so lease
      expense leaves operating costs. US GAAP ASC 842 also records a liability and asset for operating leases, but keeps
      one straight-line lease cost inside operating expenses; only finance leases are split. The same lease therefore gives
      higher EBITDA under IFRS than under US GAAP.
    analyst_impact: >-
      EBITDA, operating cash flow and net debt are not comparable between IFRS and US GAAP retailers, airlines and restaurants. Move IFRS companies to a pre-IFRS 16 basis (deduct lease payments from EBITDA) or move US companies to a post-16 basis.
    adjustment: ifrs16_to_pre16_ebitda
    keywords: [operating lease, right-of-use, rou, ebitda, ifrs 16, asc 842, lease cost, rent]
    citations:
      - {standard: "IFRS 16", ref: "paras 22-26, 47-49", url: *ifrs16}
      - {standard: "ASC 842", ref: "Subtopic 842-20 (lessee), 842-20-25", url: *asc}
    authored: acretia
    confidence: verified

  - id: diff-leases-net-debt
    topic: leases
    frameworks: [IFRS, USGAAP, SOCPA-IFRS, UAE-IFRS, EAS]
    summary: >-
      Lease liabilities are debt-like but are reported in different places. IFRS companies show them with borrowings or in
      their own line; US companies split operating and finance lease liabilities. Whether to add them to net debt depends
      on whether EBITDA in the same ratio is before or after rent.
    analyst_impact: >-
      Keep numerator and denominator consistent: post-16 EBITDA with lease-inclusive net debt, or pre-16 EBITDA with lease-exclusive net debt. Mixed bases overstate or understate leverage.
    adjustment: lease_adjusted_net_debt
    keywords: [net debt, leverage, lease liability, enterprise value, ev bridge, ev/ebitda]
    citations:
      - {standard: "IFRS 16", ref: "paras 47(b), 53(g), 58", url: *ifrs16}
      - {standard: "ASC 842", ref: "842-20-45 (balance sheet presentation)", url: *asc}
    authored: acretia
    confidence: verified

  - id: diff-leases-eas49
    topic: leases
    frameworks: [EAS, IFRS]
    summary: >-
      EAS 49 (lease contracts, issued in 2019 as part of the update that added standards based on IFRS 9, 15 and 16) mirrors IFRS 16
      for lessees: the lessee recognises a right-of-use asset and a lease liability at commencement, then depreciates the asset and accrues
      interest on the liability, as under IFRS 16. Before it, Egyptian companies used the older leasing rules where operating lease rentals were an
      expense and only finance leases appeared on the balance sheet. Expect a transition-year step in EBITDA, lease
      liabilities and retained earnings in the first EAS 49 year. The effective date and transition options were
      adjusted by later decisions and are not confirmed here.
    analyst_impact: >-
      Before adoption treat operating lease commitments as debt-like using the disclosed future rentals; after adoption use the
      lease liability line directly and compare EBITDA on a pre-16 basis. Check the adoption year for a step.
    adjustment: capitalise_operating_leases
    keywords: [eas 49, egypt, lease, operating lease, rou, adoption, transition, right-of-use, lease liability]
    verified_facts:
      - {fact: "EAS 49 Lease Contracts was issued in 2019", url: *fradec}
      - {fact: "The 2019 EAS update added standards based on IFRS 9, 15 and 16", url: *ifrsegypt}
    unverified_facts: ["EAS 49 effective date, transition method and paragraph numbers"]
    citations:
      - {standard: "EAS 49 Lease Contracts", ref: "Decisions made in 2019 (list), implementation guide listed", url: *fradec}
      - {standard: "IFRS 16", ref: "paras C1-C19 (transition)", url: *ifrs16}
    authored: acretia
    confidence: unverified

  - id: diff-revenue-ifrs15-asc606-eas48
    topic: revenue
    frameworks: [IFRS, USGAAP, EAS, IndAS, SOCPA-IFRS, UAE-IFRS]
    summary: >-
      IFRS 15 and ASC 606 share the five-step model for revenue from contracts with customers (identify the contract, the performance obligations, the transaction price, allocate it, recognise as control passes), so most revenue is recognised alike. Remaining gaps: the collectability
      test wording, treatment of some licences, impairment reversal on contract costs, and interim disclosure. EAS 48 (Revenue from Contracts with Customers, which replaced the older Egyptian revenue standard) and
      Ind AS 115 follow IFRS 15 and apply the same five-step model to contracts with customers. Under older Egyptian and UK-style rules, revenue recognition followed risk-and-reward and
      percentage-of-completion methods.
    analyst_impact: >-
      Revenue growth across the transition year can step; check the transition method and whether comparatives were restated. For gross versus net, rely on the principal-agent note.
    adjustment: revenue_principal_agent_net
    keywords: [revenue recognition, contracts with customers, five-step model, ifrs 15, asc 606, eas 48, performance obligation, contract liability, gross vs net, principal agent]
    citations:
      - {standard: "IFRS 15", ref: "paras 9, 31, B34-B38", url: *ifrs15}
      - {standard: "ASC 606", ref: "Topic 606-10-25, 606-10-55-36 to 55-40", url: *asc}
      - {standard: "EAS 48", ref: "Revenue from contracts with customers (UNVERIFIED paragraph numbers)", url: *fra}
    authored: acretia
    confidence: verified

  - id: diff-revenue-principal-agent
    topic: revenue
    frameworks: [IFRS, USGAAP, EAS, IndAS]
    summary: >-
      A company that controls goods or services before transfer reports revenue gross; an agent reports only its fee. Distributors, platforms and
      travel businesses differ in judgement, so identical business models can show revenue at very different levels while
      gross profit stays similar.
    analyst_impact: >-
      Compare margin on a net-revenue or gross-profit basis when peers differ in principal-agent conclusions.
    adjustment: revenue_principal_agent_net
    keywords: [principal, agent, gross revenue, net revenue, take rate, commission, platform, distributor]
    citations:
      - {standard: "IFRS 15", ref: "paras B34-B38", url: *ifrs15}
    authored: acretia
    confidence: verified

  - id: diff-inventory-lifo
    topic: inventory
    frameworks: [IFRS, USGAAP, EAS, FRS102, IndAS, SOCPA-IFRS, UAE-IFRS]
    summary: >-
      IFRS, EAS, FRS 102 and Ind AS ban last-in first-out. US GAAP permits it, and US companies using LIFO in rising
      prices show lower profit and inventory than FIFO peers. LIFO users disclose a LIFO reserve, the cumulative gap to FIFO.
    analyst_impact: >-
      Convert LIFO inventory to FIFO by adding the LIFO reserve and adjust cost of sales by the change in reserve before comparing margins or working capital with IFRS peers.
    adjustment: lifo_to_fifo
    keywords: [lifo, fifo, lifo reserve, inventory valuation, cost of sales, working capital]
    citations:
      - {standard: "IAS 2", ref: "paras 23-27", url: *ias2}
      - {standard: "ASC 330", ref: "330-10-30 (inventory pricing methods)", url: *asc}
    authored: acretia
    confidence: verified

  - id: diff-development-costs
    topic: development_costs
    frameworks: [IFRS, USGAAP, FRS102, IndAS, EAS]
    summary: >-
      IFRS requires capitalising development costs once defined criteria are met. US GAAP generally expenses research and
      development as incurred, with exceptions for certain software costs. FRS 102 lets entities choose to capitalise or
      expense. Capitalised development appears in intangible assets, with amortisation later.
    analyst_impact: >-
      Capitalising raises current EBIT and operating cash flow and shifts spending to investing. For comparability, expense the capitalised amount and reverse the related amortisation.
    adjustment: dev_cost_expense
    keywords: [development cost, capitalised development, r&d, research, intangible, software development, amortisation]
    citations:
      - {standard: "IAS 38", ref: "paras 54-57", url: *ias38}
      - {standard: "ASC 730", ref: "730-10-25", url: *asc}
      - {standard: "FRS 102", ref: "Section 18, paras 18.14-18.15", url: *frs102}
    authored: acretia
    confidence: verified

  - id: diff-revaluation
    topic: revaluation
    frameworks: [IFRS, USGAAP, FRS102, IndAS, EAS, SOCPA-IFRS, UAE-IFRS]
    summary: >-
      IFRS allows revaluing whole classes of PPE (and intangibles with active markets) to fair value, with the increase held in
      a revaluation surplus in OCI. US GAAP prohibits upward revaluation. Ind AS allows revaluation of PPE but not the fair
      value model for investment property. Egypt did not permit revaluation of PPE, intangibles or investment property until
      January 2023. Saudi Arabia kept the cost model for listed companies until fiscal years starting 2022 and allows
      fair value or revaluation after that.
    analyst_impact: >-
      Revalued assets lift equity and the depreciation base; reverse the surplus and the extra depreciation for return-on-capital
      comparisons across jurisdictions, and treat Egypt and Saudi periods before the change as cost-based.
    adjustment: revaluation_reverse
    keywords: [revaluation, revaluation surplus, fair value model, ppe, investment property, ias 16, ias 40]
    citations:
      - {standard: "IAS 16", ref: "paras 31-42", url: *ias16}
      - {standard: "IAS 40", ref: "paras 33-55", url: *ias40}
      - {standard: "Ind AS 40", ref: "Cost model only for investment property", url: *indas}
      - {standard: "IFRS jurisdiction profile: Egypt", ref: "Revaluation not permitted under EAS until January 2023", url: *ifrsegypt}
      - {standard: "IFRS jurisdiction profile: Saudi Arabia", ref: "Cost model for fiscal years before 2022; fair value or revaluation after", url: *ifrssaudi}
    authored: acretia
    confidence: verified

  - id: diff-impairment-reversal
    topic: impairment_reversal
    frameworks: [IFRS, USGAAP, FRS102, IndAS, EAS]
    summary: >-
      IFRS lets a company reverse an earlier impairment of PPE, intangibles other than goodwill and investments when the
      reasons fade, up to the depreciated cost that would have existed. Goodwill impairment is never reversed. US GAAP
      prohibits reversing an impairment of assets held and used; written-down cost becomes the new basis.
    analyst_impact: >-
      Reversals inflate IFRS earnings in recoveries (commodities, shipping). Remove reversals from normalised profit before comparing with US peers.
    adjustment: impairment_reversal_strip
    keywords: [impairment, reversal, write-back, goodwill, cgu, recoverable amount]
    citations:
      - {standard: "IAS 36", ref: "paras 109-125", url: *ias36}
      - {standard: "ASC 360", ref: "360-10-35-20 (restoration prohibited)", url: *asc}
    authored: acretia
    confidence: verified

  - id: diff-borrowing-costs
    topic: borrowing_costs
    frameworks: [IFRS, USGAAP, FRS102, IndAS, EAS]
    summary: >-
      IFRS requires capitalising borrowing costs on qualifying assets, and deducts investment income on funds borrowed
      specifically. US GAAP also capitalises interest but does not net investment income and uses the weighted average
      accumulated expenditure method. FRS 102 permits either capitalising or expensing.
    analyst_impact: >-
      Capitalised interest hides financing cost inside capex. Add it back to interest expense for interest cover and EBIT-to-interest ratios.
    adjustment: capitalised_interest_expense
    keywords: [capitalised interest, borrowing costs, qualifying asset, interest cover, ias 23, asc 835]
    citations:
      - {standard: "IAS 23", ref: "paras 8-18", url: *ias23}
      - {standard: "ASC 835-20", ref: "835-20-30", url: *asc}
    authored: acretia
    confidence: verified

  - id: diff-associates-jvs
    topic: associates_jvs
    frameworks: [IFRS, USGAAP, EAS, IndAS, SOCPA-IFRS, UAE-IFRS, FRS102]
    summary: >-
      Both frameworks use the equity method for associates and joint ventures. IFRS requires uniform accounting policies
      with the investor, forbids proportionate consolidation of joint ventures and treats joint operations
      line by line. US GAAP allows proportionate consolidation in some industries and the fair value option. The share of results sits in
      one P&L line, often before tax.
    analyst_impact: >-
      EBITDA should exclude equity-accounted profit; add the equity investment (or market value) to the EV bridge and consider proportionate debt.
    adjustment: associates_share_strip
    keywords: [associate, joint venture, equity method, jv, share of profit, equity accounted investees, proportionate consolidation]
    citations:
      - {standard: "IAS 28", ref: "paras 10, 35", url: *ias28}
      - {standard: "IFRS 11", ref: "paras 14-24", url: *ifrs11}
      - {standard: "ASC 323", ref: "323-10-25", url: *asc}
    authored: acretia
    confidence: verified

  - id: diff-hyperinflation-ias29
    topic: hyperinflation
    frameworks: [IFRS, USGAAP, EAS, IndAS]
    summary: >-
      IAS 29 requires restating a hyperinflationary entity's statements by a price index and reporting a net monetary gain or
      loss. US GAAP does not restate; it requires the remeasurement of the foreign subsidiary using the parent's currency as
      functional currency when cumulative three-year inflation is about 100 percent. Argentina and Turkey are on the current lists of
      economies where IAS 29 applies. Egypt is not treated as hyperinflationary at the end of 2025 but sits on a watchlist
      with Angola, Myanmar, Nigeria and Syria.
    analyst_impact: >-
      Restate or at least flag results in hyperinflationary economies (Argentina, Turkey and others on the current list); use
      constant-currency and avoid mixing indexed and unindexed periods. For Egypt keep the status under review rather than assuming IAS 29.
    adjustment: ias29_restate
    keywords: [ias 29, hyperinflation, hyperinflationary, price index, monetary gain, inflation accounting, turkey, argentina, egypt inflation, watchlist]
    verified_facts:
      - {fact: "Egypt not hyperinflationary at 31 Dec 2025; on watchlist with Angola, Myanmar, Nigeria, Syria; Argentina and Turkey on the IAS 29 list", url: *bdohyper}
    citations:
      - {standard: "IAS 29", ref: "paras 3-8, 11-34", url: *ias29}
      - {standard: "ASC 830", ref: "830-10-45-11", url: *asc}
      - {standard: "BDO IFRB 2026/07", ref: "Year-end hyperinflationary economies update (Egypt on watchlist)", url: *bdohyper}
    authored: acretia
    confidence: verified

  - id: diff-fx-translation
    topic: fx_translation
    frameworks: [IFRS, USGAAP, EAS, FRS102, IndAS, SOCPA-IFRS, UAE-IFRS]
    summary: >-
      Under IAS 21 and ASC 830, a foreign operation is translated into the reporting currency with the closing rate for the
      balance sheet and average (or transaction date) rates for the income statement, and the difference goes to OCI as a
      translation reserve. Using the wrong rate mix distorts margins and ratios.
    analyst_impact: >-
      Compare companies on the same translation basis. Use period-end rates for balances and period average for flows; keep a constant-currency view for growth.
    adjustment: fx_translate_period_end_average
    keywords: [translation, closing rate, average rate, cta, reporting currency, constant currency, functional currency]
    citations:
      - {standard: "IAS 21", ref: "paras 38-47", url: *ias21}
      - {standard: "ASC 830", ref: "830-30-45", url: *asc}
    authored: acretia
    confidence: verified

  - id: diff-fx-devaluation-ias21
    topic: fx_devaluation
    frameworks: [IFRS, EAS, SOCPA-IFRS, UAE-IFRS]
    summary: >-
      When a currency is devalued, monetary items in foreign currency (debt, payables, cash) are retranslated at the new
      closing rate and the full difference hits profit or loss under IAS 21. Importers with USD debt show big losses,
      exporters with USD cash show gains. Egypt had devaluations in 2016 and 2022 (recognised in the IFRS Foundation
      jurisdiction profile). On 6 March 2024 the central bank moved to a flexible, market-determined exchange rate and raised rates by 600 basis points:
      the official rate, held near 30.9 per USD for more than a year, jumped to about 50 (an intraday record of about 50.6) within a day. Revenue in local currency
      also steps up as prices are reset, so a single year mixes a one-off translation loss with a changed operating base. In reporting, USD monetary
      items carried at about 30.9 at the 2023 year end are retranslated at the new rate in the first 2024 quarter, so the loss lands in Q1 2024 results (EAS 13, replaced by
      PM Decree 636 of 2024, takes it to profit or loss), unless an entity still applies a deferral allowed by the earlier special treatment.
    analyst_impact: >-
      Strip devaluation FX losses out of recurring EBITDA and earnings. Take the FX gain or loss line (and any FX embedded in finance
      costs or cost of sales) out of operating profit, tax-effect it, and show adjusted net income beside reported. Where an
      entity capitalised or deferred FX loss under EAS 13 special treatment, add the deferred charge back so the period carries its
      economic cost. Treat the March 2024 retranslation as a one-off in the first quarter of 2024 and do not extrapolate it or the later EGP-denominated revenue step; compare 2023 and 2024 on a USD or constant-rate basis. Then check the unhedged USD debt still outstanding, since the next devaluation repeats the effect.
    adjustment: devaluation_fx_loss_normalise
    keywords: [devaluation, float, flexible exchange rate, 6 march 2024, 30.9, 50, market-determined, egyptian pound, egp, fx loss, usd debt, 2016, 2022, 2023, 2024, exchange loss, recurring ebitda, normalised earnings]
    verified_facts:
      - {fact: "Egypt applied special translation treatment after the 2016 and 2022 devaluations", url: *ifrsegypt}
      - {fact: "6 March 2024: CBE moved to market-determined rate; official rate about 30.9 per USD for over a year before, record low about 50.6", url: *kuwaittimes}
      - {fact: "6 March 2024: policy rates raised 600 basis points; pound about 52 at its weakest official level that afternoon", url: *thenational}
    unverified_facts: ["The January 2023 devaluation step", "Post-float rate path after 6 March 2024 (about 47 to 50 range in later trading)", "How the 2024 EAS 13 treats FX differences in detail"]
    citations:
      - {standard: "IAS 21", ref: "paras 23, 28", url: *ias21}
      - {standard: "IFRS jurisdiction profile: Egypt", ref: "Foreign currency translation differences", url: *ifrsegypt}
      - {standard: "Central Bank of Egypt", ref: "Official exchange rate history", url: *cbe}
      - {standard: "Kuwait Times (Reuters report)", ref: "6 March 2024 float", url: *kuwaittimes}
    authored: acretia
    confidence: unverified

  - id: diff-fx-eas13-special-treatment
    topic: fx_devaluation
    frameworks: [EAS]
    summary: >-
      Egypt added special accounting treatments for devaluations to EAS 13: an appendix tied to the 2016 liberalisation and
      later appendices B (Prime Ministerial Decision 1568 of 2022) and C (Prime Ministerial Decision 4706 of 2022), alongside
      FRA Decision 843 of 2022 as amended by Decision 1378 of 2022. In general they let an entity put part of the loss on
      foreign currency items into the cost of related assets or defer it, instead of taking it all to profit; the IFRS
      Foundation profile notes this was a one-time application extended to the end of 2023 and affects depreciation of
      remeasured assets. A Prime Ministerial decree of 2024 (No. 636) then replaced EAS 13 itself.
    analyst_impact: >-
      Reported earnings under special treatment can be flattered by deferral. Add the deferred balance back as a charge, remove capitalised FX loss
      from asset cost and the extra depreciation, and compare to IFRS peers on a normalised basis.
    adjustment: devaluation_fx_loss_normalise
