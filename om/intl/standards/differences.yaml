  - id: diff-business-combinations
    topic: business_combinations
    frameworks: [IFRS, USGAAP, IndAS, FRS102, EAS]
    summary: >-
      IFRS 3 and ASC 805 both require the acquisition method for business combinations: identify the acquirer, measure assets and liabilities at fair
      value, recognise goodwill, expense deal costs; pooling of interests is not allowed for acquisitions. Transactions under common control are outside the
      scope of IFRS 3, so practice varies (book value or predecessor accounting, sometimes with restatement of comparatives); US GAAP uses carrying
      amounts for common-control transfers. Ind AS 103 Appendix C prescribes pooling of interests at carrying values for common-control
      combinations, so no goodwill arises. FRS 102 uses acquisition accounting for acquisitions but still allows merger accounting for qualifying group reconstructions.
    analyst_impact: >-
      After a group reorganisation, expect no fair value step-up or goodwill under pooling or merger accounting and restated comparatives; for acquisitions
      compare on the acquisition method and add back purchase-price amortisation. Use pro forma figures to compare organic growth.
    adjustment: associates_share_strip
    keywords: [business combination, acquisition method, pooling of interests, common control, predecessor accounting, merger accounting, ifrs 3, asc 805, ind as 103, group reconstruction, goodwill]
    citations:
      - {standard: "IFRS 3", ref: "paras 2(c) (common control scope exclusion), 4-5, 32", url: *ifrs3}
      - {standard: "ASC 805", ref: "805-10, 805-50 (common control)", url: *asc}
      - {standard: "Ind AS 103", ref: "Appendix C (common control, pooling of interests)", url: *indas}
      - {standard: "FRS 102", ref: "Section 19 (acquisitions and group reconstructions)", url: *frs102}
    authored: acretia
    confidence: verified

  - id: diff-provisions-ias37-asc450
    topic: provisions
    frameworks: [IFRS, USGAAP, EAS, IndAS, FRS102]
    summary: >-
      Under IAS 37 a provision needs a present obligation, legal or constructive, arising from a past event, a probable outflow of
      economic benefits (more likely than not), and a reliable estimate; it is measured at the best estimate and discounted when the effect is material.
      Possible obligations or ones that cannot be measured are contingent liabilities, disclosed but not booked. US GAAP (ASC 450) accrues a loss
      contingency when a loss is probable (a higher likelihood bar than IFRS) and reasonably estimable, uses the low end of a range when no point is better, and
      generally does not discount. Egyptian, Indian and UK standards follow the IAS 37 approach.
    analyst_impact: >-
      IFRS reporters book some litigation and restructuring liabilities earlier and at a higher point in a range than US reporters; treat
      litigation, decommissioning and warranty provisions with expected cash outflows as debt-like and read the contingent liability note for unbooked exposure.
    adjustment: eosb_as_debt_like
    keywords: [provision, present obligation, constructive obligation, past event, probable, reliable estimate, contingent liability, ias 37, asc 450, loss contingency]
    citations:
      - {standard: "IAS 37", ref: "paras 14, 36, 45, 86", url: *ias37}
      - {standard: "ASC 450", ref: "450-20-25 (loss contingencies)", url: *asc}
    authored: acretia
    confidence: verified
