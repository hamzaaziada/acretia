<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Matrix</title>
<style>
:root{--bg:#fafaf9;--panel:#fff;--ink:#1c1917;--muted:#78716c;--line:#e7e5e4;--accent:#2563eb;--chip:#f5f5f4;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--mark:#fde68a}
@media (prefers-color-scheme: dark){:root{--bg:#0c0a09;--panel:#1c1917;--ink:#f5f5f4;--muted:#a8a29e;--line:#292524;--accent:#60a5fa;--chip:#292524;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--mark:#854d0e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header a{color:var(--muted);text-decoration:none}header a.on{color:var(--ink);font-weight:600}
.wrap{max-width:1400px;margin:0 auto;padding:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
input,select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
button{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font:inherit}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:15px}
.cols .colrow{display:grid;grid-template-columns:160px 110px 1fr 32px;gap:6px;margin-bottom:6px}
@media (max-width:700px){.cols .colrow{grid-template-columns:1fr}}
.grid{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:max-content;min-width:100%}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left;max-width:320px}
th{position:sticky;top:0;background:var(--chip);font-size:12px;z-index:1}
th small{display:block;font-weight:400;color:var(--muted)}
td.doc{position:sticky;left:0;background:var(--panel);min-width:180px;font-size:12px}
td.cell{cursor:pointer;font-size:13px}
td.cell:hover{background:var(--chip)}
.badge{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:0 5px;margin-right:4px;text-transform:uppercase}
.s-ok{color:var(--ok);border:1px solid var(--ok)}.s-unverified{color:var(--warn);border:1px solid var(--warn)}
.s-not_found{color:var(--muted);border:1px solid var(--muted)}.s-extracted{color:var(--accent);border:1px solid var(--accent)}.s-error,.s-refused{color:var(--bad);border:1px solid var(--bad)}
.muted{color:var(--muted)}
#side{position:fixed;top:0;right:0;width:min(480px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);padding:16px;overflow:auto;transform:translateX(100%);transition:transform .15s;z-index:10}
#side.open{transform:none}
blockquote{margin:8px 0;padding:8px 10px;border-left:3px solid var(--accent);background:var(--chip);border-radius:0 6px 6px 0}
#status{font-size:13px}
</style>
</head>
<body>
<header><b>Research</b><a href="/ask.html">Ask</a><a href="/rooms.html">Data Rooms</a><a href="/">Search</a><a href="/matrix.html" class="on">Matrix</a><a href="/sheets.html">Sheets</a><a href="/studio.html">Deck Studio</a><a href="/rounds.html">Funding Rounds</a><a href="/check.html">Check</a><a href="/settings.html">Settings</a><span class="muted" style="margin-left:auto;font-size:12px">Every cell is cited and checked against the filing text. Without an API key, cells quote the best-matching passage.</span></header>
<div class="wrap">
  <div class="panel">
    <div class="row"><select id="pick"><option value="">Open a matrix…</option></select><span class="muted">or create one below</span></div>
    <details id="createBox"><summary><b>New matrix</b></summary>
      <div class="row" style="margin-top:10px">
        <input id="name" placeholder="Name (e.g. falcon-diligence)">
        <select id="roomSel" title="Rows from"><option value="">Rows from: public filings search</option></select>
        <input id="query" placeholder="Search to pick rows (optional for a data room = all its documents)" style="flex:1;min-width:260px">
        <input id="tickers" placeholder="Tickers" style="width:140px">
        <input id="forms" placeholder="Forms (10-K,10-Q)" style="width:140px">
        <input id="maxRows" type="number" value="10" min="1" max="200" style="width:80px" title="max rows">
      </div>
      <div class="cols" id="colEditor"></div>
      <div class="row"><button onclick="addColRow()">+ Column</button><button class="primary" onclick="createMatrix()">Create</button></div>
    </details>
  </div>
  <div id="view" hidden>
    <div class="row">
      <h3 id="title" style="margin:0"></h3>
      <button class="primary" onclick="runMatrix()">Run (fill empty cells)</button>
      <select id="effort" title="effort"><option>low</option><option selected>medium</option><option>high</option></select>
      <a id="exportLink" href="#"><button>Export CSV</button></a>
      <details><summary>Add column</summary><div class="cols" id="addCol"></div><button onclick="addColumn()">Add</button></details>
      <span id="status" class="muted"></span>
    </div>
    <div class="grid"><table id="tbl"></table></div>
  </div>
</div>
<aside id="side"><button onclick="side.classList.remove('open')" style="float:right">Close</button><div id="sideBody"></div></aside>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TYPES = ["text","number","percent","currency","date","boolean","list"];
const isRoom = d => String(d.url || "").startsWith("room://");
const fileUrl = d => isRoom(d) ? `/api/file?doc_id=${d.doc_id}` : d.url;
const docLabel = d => isRoom(d)
  ? `<b>${esc(d.title)}</b><br><span class="muted">${esc(d.path.split("/").slice(0,-1).join(" / "))}</span><br><a href="${fileUrl(d)}" target="_blank" rel="noopener">open ↗</a>`
  : `<b>${esc(d.ticker||"")}</b> ${esc(d.form)}<br><span class="muted">${esc(d.filed)}</span><br><a href="${esc(d.url)}" target="_blank" rel="noopener">sec.gov ↗</a>`;
let current = null, poll = null, data = null;

function colRow(c = {}) {
  return `<div class="colrow"><input placeholder="Column name" value="${esc(c.name||"")}"><select>${TYPES.map(t=>`<option ${t===(c.type||"text")?"selected":""}>${t}</option>`).join("")}</select><input placeholder="Question to ask each document" value="${esc(c.question||"")}"><button onclick="this.parentElement.remove()">×</button></div>`;
}
function readCols(el) {
  return [...el.querySelectorAll(".colrow")].map(r => { const [n,t,q] = r.querySelectorAll("input,select"); return {name:n.value.trim(), type:t.value, question:q.value.trim()}; }).filter(c => c.name && c.question);
}
function addColRow(c) { $("colEditor").insertAdjacentHTML("beforeend", colRow(c)); }
[["Revenue","currency","What was total revenue (net sales) for the most recent fiscal period covered?"],
 ["Key risks","list","What are the three most significant risks disclosed?"],
 ["Guidance","text","What forward-looking guidance or outlook does management give?"]].forEach(([name,type,question]) => addColRow({name,type,question}));
$("addCol").innerHTML = colRow();

async function post(path, body) { const r = await fetch(path, {method:"POST", body: JSON.stringify(body)}); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; }

async function loadList(select) {
  const ms = await fetch("/api/matrices").then(r=>r.json());
  $("pick").innerHTML = '<option value="">Open a matrix…</option>' + ms.map(m => `<option value="${m.id}">${esc(m.name)} (${m.rows} rows)</option>`).join("");
  if (select) $("pick").value = select;
}
$("pick").onchange = () => $("pick").value && openMatrix(+$("pick").value);

async function createMatrix() {
  const filters = {};
  if ($("tickers").value) filters.tickers = $("tickers").value.split(/[\s,]+/).filter(Boolean);
  if ($("forms").value) filters.forms = $("forms").value.split(",").map(s=>s.trim()).filter(Boolean);
  try {
    const roomId = $("roomSel").value ? +$("roomSel").value : null;
    if (!roomId && !$("query").value.trim()) throw new Error("Enter a search, or pick a data room");
    const r = await post("/api/matrix/create", {name:$("name").value.trim(), query:$("query").value.trim(), room: roomId, filters, max_rows:+$("maxRows").value, columns: readCols($("colEditor"))});
    $("createBox").open = false; await loadList(r.id); openMatrix(r.id);
  } catch (e) { alert(e.message); }
}
async function addColumn() {
  const [c] = readCols($("addCol")); if (!c) return;
  await post("/api/matrix/column", {id: current, column: c}); $("addCol").innerHTML = colRow(); openMatrix(current);
}
async function runMatrix() {
  try { await post("/api/matrix/run", {id: current, effort: $("effort").value}); } catch (e) { $("status").textContent = e.message; return; }
  clearInterval(poll); poll = setInterval(() => openMatrix(current, true), 2500); openMatrix(current, true);
}
async function openMatrix(id, quiet) {
  current = id; data = await fetch("/api/matrix?id=" + id).then(r=>r.json());
  $("view").hidden = false; $("title").textContent = $("pick").selectedOptions[0]?.text || `Matrix ${id}`;
  $("exportLink").href = "/api/matrix/export?id=" + id;
  const run = data.run;
  if (run?.state === "running") $("status").textContent = `Running… ${run.done}/${run.total || "?"} rows`;
  else if (run?.state === "done") {
    $("status").textContent = run.engine === "extractive"
      ? `Done (extractive, no API key): ${run.extracted} quoted from the filing · ${run.not_found} not found. Add an API key later to get written answers.`
      : `Done: ${run.ok} verified · ${run.unverified} need review · ${run.not_found} not found · ${run.error + (run.refused||0)} failed · ${(run.input_tokens/1000).toFixed(0)}k in / ${(run.output_tokens/1000).toFixed(0)}k out tokens (${(run.cache_read_input_tokens/1000).toFixed(0)}k cached)`;
    clearInterval(poll); }
  else if (run?.state === "error") { $("status").textContent = "Error: " + run.error; clearInterval(poll); }
  else $("status").textContent = "";
  const cols = data.columns;
  $("tbl").innerHTML = `<tr><th>Document</th>${cols.map(c => `<th>${esc(c.name)}<small>${esc(c.question)}</small></th>`).join("")}</tr>` +
    data.rows.map((r, ri) => `<tr><td class="doc">${docLabel(r.doc)}</td>` +
      cols.map(c => { const x = r.cells[c.name]; if (!x) return `<td class="cell muted">—</td>`;
        return `<td class="cell" onclick="openCell(${ri}, ${JSON.stringify(c.name).replace(/"/g,"&quot;")})"><span class="badge s-${x.status}">${x.status.replace("_"," ")}</span>${esc((x.answer||x.error||"").slice(0,220))}</td>`; }).join("") + `</tr>`).join("");
}
function openCell(ri, col) {
  const r = data.rows[ri], x = r.cells[col];
  $("sideBody").innerHTML = `<h3>${esc(col)}</h3><div class="muted">${esc(r.doc.company)} · ${esc(r.doc.form)} · ${esc(r.doc.filed)}</div>
    <p><span class="badge s-${x.status}">${x.status.replace("_"," ")}</span> confidence: ${esc(x.confidence||"—")}</p>
    <p style="font-size:15px">${esc(x.answer)}</p>${x.value != null ? `<p class="muted">Value: <b>${esc(JSON.stringify(x.value))}</b> ${esc(x.unit||"")}</p>` : ""}
    ${x.error ? `<p style="color:var(--bad)">${esc(x.error)}</p>` : ""}
    <h3>Sources</h3>${(x.citations||[]).map(c => `<blockquote>“${esc(c.quote)}”<div class="muted" style="font-size:12px;margin-top:4px">${c.verified ? "✓ found verbatim in" : "⚠ NOT found in"} passage P${c.passage_id}${c.section ? " · " + esc(c.section) : ""}</div></blockquote>`).join("") || '<p class="muted">No citations</p>'}
    <p><a href="${esc(fileUrl(r.doc))}" target="_blank" rel="noopener">${isRoom(r.doc) ? "Open " + esc(r.doc.path) : "Open filing on sec.gov"} ↗</a>${isRoom(r.doc) ? "" : " · accession " + esc(r.doc.accession)}</p>`;
  $("side").classList.add("open");
}
const initQ = new URLSearchParams(location.search);
fetch("/api/rooms").then(r => r.json()).then(rs => {
  $("roomSel").insertAdjacentHTML("beforeend", rs.map(r => `<option value="${r.id}">Rows from: data room “${esc(r.name)}” (${r.documents} docs)</option>`).join(""));
  if (initQ.get("room")) {
    $("roomSel").value = initQ.get("room"); $("createBox").open = true;
    $("colEditor").innerHTML = "";
    [["Revenue","currency","What was revenue in the most recent fiscal year?"],
     ["EBITDA","currency","What was adjusted EBITDA?"],
     ["Customer concentration","text","How concentrated is revenue among the largest customers?"],
     ["Change of control","text","Are there change of control provisions in material contracts?"],
     ["Litigation","text","Is there any material pending litigation?"]].forEach(([name,type,question]) => addColRow({name,type,question}));
  }
});
fetch("/api/engine").then(r => r.json()).then(e => { document.querySelector("header .muted").textContent = e.engine === "extractive" ? "Engine: extractive (no model configured) — every cell quotes the best-matching passage, with page." : `Engine: ${e.model} — answers are checked against the source text`; });
loadList().then(() => { const id = initQ.get("id"); if (id) { $("pick").value = id; openMatrix(+id); } });
</script>
</body>
</html>
